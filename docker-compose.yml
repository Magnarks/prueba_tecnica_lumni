services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumni
      POSTGRES_USER: lumni
      POSTGRES_PASSWORD: lumni
    ports:
      - "5433:5432"
    volumes:
      - lumni_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumni -d lumni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lumni_pgdata: